[package]
name = "destiny-bevy-compat"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Destiny API and Carbon interoperability facade for Bevy/Avian"

[lib]
name = "destiny_bevy_compat"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["carbon-network"]
carbon-network = [
    "dep:bevy_replicon",
    "dep:lightyear_messages",
    "dep:lightyear_connection",
    "dep:lightyear_replication",
    "dep:lightyear_transport",
]

[dependencies]
avian3d = { version = "=0.7.0", default-features = false, features = ["3d", "f64", "parry-f64", "enhanced-determinism", "serialize"] }
base64 = "=0.22.1"
bevy = { version = "=0.19.1", default-features = false, features = ["std", "bevy_log", "bevy_state", "serialize"] }
bevy_replicon = { version = "=0.42.3", default-features = false, features = ["client", "server"], optional = true }
lightyear_messages = { version = "=0.29.0", default-features = false, features = ["std", "client", "server"], optional = true }
lightyear_connection = { version = "=0.29.0", default-features = false, features = ["client", "server"], optional = true }
lightyear_replication = { version = "=0.29.0", default-features = false, features = ["std", "client", "server"], optional = true }
lightyear_transport = { version = "=0.29.0", default-features = false, features = ["std", "client", "server"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
