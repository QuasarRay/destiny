[workspace]
resolver = "3"
members = [
    "blue-rs/crates/blue",
    "blue-rs/crates/blueexposure",
    "blue-rs/crates/blue-macros",
    "blue-rs/crates/blue-codegen",
    "blue-rs/crates/bluepycore",
    "destiny-rs",
]
default-members = [
    "destiny-rs",
    "blue-rs/crates/blue",
    "blue-rs/crates/blueexposure",
    "blue-rs/crates/blue-macros",
    "blue-rs/crates/blue-codegen",
    "blue-rs/crates/bluepycore",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Carbon Engine contributors"]
repository = "https://github.com/QuasarRay/destiny"

[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["default_app", "serialize", "bevy_asset"] }
cgp = "=0.8.0-alpha"
derive-deftly = "=1.14.0"
pyo3 = { version = "=0.30.1", features = ["macros"] }
genco = "=0.19.0"
delegate = "=0.13.5"
derive_more = { version = "=2.1.1", features = ["display", "from", "deref", "deref_mut"] }
proc-macro2 = "=1.0.107"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
roxmltree = "0.21"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"

blue = { path = "blue-rs/crates/blue" }
blueexposure = { path = "blue-rs/crates/blueexposure" }
blue-macros = { path = "blue-rs/crates/blue-macros" }
blue-codegen = { path = "blue-rs/crates/blue-codegen" }

[workspace.lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
