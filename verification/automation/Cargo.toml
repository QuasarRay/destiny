[package]
name = "destiny-verification-automation"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
cgp = { git = "https://github.com/contextgeneric/cgp.git", rev = "eca0c5fda60d87cf048460f5abdd3b6e82da5e0f" }
kani_metadata = { path = "../../third_party/kani/kani_metadata" }
proc-macro2 = "=1.0.107"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.8"
synthez = { version = "=0.5.1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
