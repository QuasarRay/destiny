name: formal-verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specification-and-meta:
    name: specification and metaverification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version
          python --version

      - name: Test engine-independent original-Destiny specification
        run: cargo test --manifest-path verification/spec/Cargo.toml

      - name: Check procedural macro crate
        run: cargo check --manifest-path verification/meta/Cargo.toml

      - name: Test declarative metaverification support
        run: cargo test --manifest-path verification/meta-support/Cargo.toml

      - name: Compile and run non-Kani proof-crate regression tests
        run: cargo test --manifest-path verification/kani/Cargo.toml

      - name: Validate proof markers against exhaustive original test catalog
        run: python verification/tools/proof_coverage.py

      - name: Scan repeated implementation and proof patterns
        run: python verification/tools/pattern_scan.py --json > repetition-patterns.json

      - uses: actions/upload-artifact@v4
        with:
          name: formal-repetition-patterns
          path: repetition-patterns.json

  vendor-automation-boundary:
    name: vendored Verus/Kani automation boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify immutable upstream source pins
        run: python3 -B verification/tools/check_vendor_integrity.py

      - name: Materialize Kani compiler source dependency
        run: git -C third_party/kani submodule update --init --depth=1 charon

      - name: Apply validated metadata-only Kani patch
        run: python3 -B verification/tools/bootstrap_kani_vendor.py

      - name: Install pinned Kani source toolchain
        run: |
          rustup toolchain install nightly-2026-08-21 --profile minimal
          rustup component add --toolchain nightly-2026-08-21 rustc-dev rust-src llvm-tools rustfmt

      - name: Test shared autoharness metadata adapter
        run: |
          cargo +nightly-2026-08-21 test --manifest-path verification/automation/Cargo.toml --locked
          python3 -B verification/tools/test_kani_discovery.py

      - name: Build patched pinned Kani from source
        working-directory: third_party/kani
        run: cargo +nightly-2026-08-21 build-dev -- --release

      - name: Discover automatic harnesses with CBMC and GOTO execution forbidden
        run: python3 -B verification/tools/run_kani_autoharness_discovery.py

      - name: Normalize real Kani compiler metadata for the Verus-default planner
        run: |
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            discover .aegis/destiny/kani-autoharness-discovery/kani-metadata.json \
            > .aegis/destiny/kani-autoharness-discovery/normalized-discovery.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path(".aegis/destiny/kani-autoharness-discovery/normalized-discovery.json")
          data=json.loads(p.read_text())
          assert data["default_engine"] == "verus"
          assert data["proof_credit"] is False
          assert data["crates_with_autoharness_metadata"] > 0
          assert data["candidates"], "empty autoharness candidate inventory"
          print(json.dumps({
              "default_engine": data["default_engine"],
              "candidates": len(data["candidates"]),
              "proof_credit": data["proof_credit"],
          }, sort_keys=True))
          PY

      - name: Bind Kani-selected Destiny functions to reviewed Verus entries
        run: |
          python3 -B verification/tools/bind_kani_verus.py bind \
            --normalized .aegis/destiny/kani-autoharness-discovery/normalized-discovery.json \
            --output .aegis/destiny/kani-autoharness-discovery/verus-binding.json
          python3 -B verification/tools/test_bind_kani_verus.py

      - name: Discover the generated-obligation fixture corpus through the same Kani compiler path
        run: |
          set -euo pipefail
          for fixture in valid invalid unsupported contracts; do
            out=".aegis/destiny/kani-autoharness-fixtures/$fixture"
            python3 -B verification/tools/run_kani_autoharness_discovery.py \
              --manifest-path "verification/automation/fixtures/$fixture/Cargo.toml" \
              --output-dir "$out"
            cargo +nightly-2026-08-21 run --quiet \
              --manifest-path verification/automation/Cargo.toml --locked -- \
              discover "$out/kani-metadata.json" \
              > "$out/normalized-discovery.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path(
              ".aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json"
          ).read_text())
          assert contract["proof_credit"] is False, contract
          rows=contract["contracted_functions"]
          expected={
              "contracted_valid",
              "contracted_invalid",
              "contracted_vacuous",
              "contracted_arithmetic",
              "contracted_result_valid",
              "contracted_result_invalid",
              "contracted_result_add_valid",
              "contracted_result_add_invalid",
          }
          by_name={}
          for row in rows:
              name=next((name for name in expected if row["function"].endswith(name)), None)
              assert name is not None, row
              assert name not in by_name, (name, rows)
              by_name[name]=row
              assert row["file"].endswith("src/lib.rs"), row
              assert row["provenance"] == "kani_metadata::KaniMetadata::contracted_functions", row
              assert row["clauses"], row
              assert all(clause["kind"] in {"requires","ensures","modifies"} for clause in row["clauses"]), row
              assert all(clause["expression"].strip() for clause in row["clauses"]), row
          assert set(by_name) == expected, by_name
          assert [c["kind"] for c in by_name["contracted_valid"]["clauses"]].count("requires") == 1
          assert [c["kind"] for c in by_name["contracted_valid"]["clauses"]].count("ensures") == 1
          assert [c["kind"] for c in by_name["contracted_vacuous"]["clauses"]].count("requires") == 2
          assert any(
              clause["kind"] == "requires" and "+" in clause["expression"]
              for clause in by_name["contracted_arithmetic"]["clauses"]
          )
          selected={
              name: [
                  candidate for candidate in contract["candidates"]
                  if candidate["function"].endswith(name)
              ]
              for name in expected
          }
          assert all(len(rows) == 1 for rows in selected.values()), selected
          assert all(rows[0]["disposition"] == "kani_eligible" for rows in selected.values()), selected
          PY
          python3 -B verification/tools/test_verus_subset.py

      - name: Retain Kani-to-Verus discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-verus-automation-discovery
          path: .aegis/destiny/kani-autoharness-discovery

      - name: Retain generated-obligation fixture discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-verus-fixture-discovery
          path: .aegis/destiny/kani-autoharness-fixtures

  kani:
    name: Kani 0.68.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
          cargo kani --version

      - name: Verify Kani harnesses
        run: cargo kani -Z function-contracts -Z stubbing --manifest-path verification/kani/Cargo.toml --output-format=terse

  verus:
    name: Verus 0.2026.09.20.aef82ed
    needs: vendor-automation-boundary
    runs-on: ubuntu-24.04
    env:
      VERUS_RELEASE: 0.2026.09.20.aef82ed
      VERUS_SHA256: 7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Reuse Kani compiler discovery from the automation gate
        uses: actions/download-artifact@v4
        with:
          name: kani-verus-automation-discovery
          path: .aegis/destiny/kani-autoharness-discovery

      - name: Reuse Kani fixture discovery from the automation gate
        uses: actions/download-artifact@v4
        with:
          name: kani-verus-fixture-discovery
          path: .aegis/destiny/kani-autoharness-fixtures

      - name: Check out the pinned maintained controller
        uses: actions/checkout@v4
        with:
          repository: QuasarRay/Aegis
          ref: 46f90f7dbc4f3db8a1a74ef9d8aa91fb4b679460
          path: .agents

      - name: Apply and validate the exported controller postimages
        run: python3 -B verification/tools/bootstrap_controller.py

      - name: Apply validated Kani metadata patch for shared automation wrapper
        run: python3 -B verification/tools/bootstrap_kani_vendor.py

      - name: Install verifier toolchains
        run: |
          rustup toolchain install 1.98.1-x86_64-unknown-linux-gnu
          rustup toolchain install nightly-2026-08-21 --profile minimal

      - name: Download pinned Verus release
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/verus-lang/verus/releases/download/release/$VERUS_RELEASE/verus-$VERUS_RELEASE-x86-linux.zip" \
            --output verus.zip
          echo "$VERUS_SHA256  verus.zip" | sha256sum --check -
          mkdir verus-dist
          unzip -q verus.zip -d verus-dist
          VERUS_BIN="$(find verus-dist -type f -name verus -perm -u+x | head -n 1)"
          test -n "$VERUS_BIN"
          echo "VERUS_BIN=$VERUS_BIN" >> "$GITHUB_ENV"
          "$VERUS_BIN" --version

      - name: Check restricted branch, literal-loop and failure fixtures through Verus
        run: |
          set -euo pipefail
          python3 -B verification/tools/test_verus_subset.py
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- explain \
            > fixture-capabilities.json

          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/valid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/valid/normalized-discovery.json \
            --function branch_valid --verus "$VERUS_BIN" > fixture-branch.json

          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/valid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/valid/normalized-discovery.json \
            --function fixed_loop_valid --verus "$VERUS_BIN" > fixture-loop.json

          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/valid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/valid/normalized-discovery.json \
            --function independent_inputs --verus "$VERUS_BIN" > fixture-independent.json

          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/valid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/valid/normalized-discovery.json \
            --function assumed_valid --verus "$VERUS_BIN" > fixture-assumed.json

          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/valid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/valid/normalized-discovery.json \
            --function guarded_add_valid --verus "$VERUS_BIN" > fixture-guarded-add.json
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/valid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/valid/normalized-discovery.json \
            --function guarded_sub_valid --verus "$VERUS_BIN" > fixture-guarded-sub.json

          generic_fn="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path(".aegis/destiny/kani-autoharness-fixtures/valid/normalized-discovery.json").read_text())
          matches=[row["function"] for row in data["candidates"]
                   if row["disposition"] == "kani_eligible"
                   and row["function"].endswith("generic_selected::<i32>")]
          assert len(matches) == 1, matches
          print(matches[0])
          PY
          )"
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/valid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/valid/normalized-discovery.json \
            --function "$generic_fn" --verus "$VERUS_BIN" > fixture-generic.json

          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/contracts/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json \
            --function contracted_valid --verus "$VERUS_BIN" > fixture-contract-valid.json

          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/contracts/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json \
            --function contracted_result_valid --verus "$VERUS_BIN" > fixture-contract-result-valid.json

          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/contracts/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json \
            --function contracted_result_add_valid --verus "$VERUS_BIN" > fixture-contract-result-add-valid.json

          set +e
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/invalid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/invalid/normalized-discovery.json \
            --function branch_invalid --verus "$VERUS_BIN" > fixture-invalid.json
          invalid_rc=$?
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/invalid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/invalid/normalized-discovery.json \
            --function contradictory_assumption --verus "$VERUS_BIN" > fixture-contradictory.json
          contradictory_rc=$?
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/invalid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/invalid/normalized-discovery.json \
            --function add_overflow_invalid --verus "$VERUS_BIN" > fixture-add-overflow.json
          add_overflow_rc=$?
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/invalid/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/invalid/normalized-discovery.json \
            --function sub_underflow_invalid --verus "$VERUS_BIN" > fixture-sub-underflow.json
          sub_underflow_rc=$?
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/unsupported/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/unsupported/normalized-discovery.json \
            --function float_unsupported --verus "$VERUS_BIN" > fixture-unsupported.json
          unsupported_rc=$?
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/contracts/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json \
            --function contracted_invalid --verus "$VERUS_BIN" > fixture-contract-invalid.json
          contract_invalid_rc=$?
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/contracts/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json \
            --function contracted_vacuous --verus "$VERUS_BIN" > fixture-contract-vacuous.json
          contract_vacuous_rc=$?
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/contracts/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json \
            --function contracted_arithmetic --verus "$VERUS_BIN" > fixture-contract-arithmetic.json
          contract_arithmetic_rc=$?
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/contracts/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json \
            --function contracted_result_invalid --verus "$VERUS_BIN" > fixture-contract-result-invalid.json
          contract_result_invalid_rc=$?
          cargo +nightly-2026-08-21 run --quiet --manifest-path verification/automation/Cargo.toml --locked -- verify \
            --manifest-path verification/automation/fixtures/contracts/Cargo.toml \
            --discovery .aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json \
            --function contracted_result_add_invalid --verus "$VERUS_BIN" > fixture-contract-result-add-invalid.json
          contract_result_add_invalid_rc=$?
          set -e
          test "$invalid_rc" -eq 1
          test "$contradictory_rc" -eq 1
          test "$add_overflow_rc" -eq 1
          test "$sub_underflow_rc" -eq 1
          test "$unsupported_rc" -eq 1
          test "$contract_invalid_rc" -eq 1
          test "$contract_vacuous_rc" -eq 1
          test "$contract_arithmetic_rc" -eq 1
          test "$contract_result_invalid_rc" -eq 1
          test "$contract_result_add_invalid_rc" -eq 1

          python3 - <<'PY'
          import json
          from pathlib import Path
          branch=json.loads(Path("fixture-branch.json").read_text())
          loop=json.loads(Path("fixture-loop.json").read_text())
          independent=json.loads(Path("fixture-independent.json").read_text())
          assumed=json.loads(Path("fixture-assumed.json").read_text())
          guarded_add=json.loads(Path("fixture-guarded-add.json").read_text())
          guarded_sub=json.loads(Path("fixture-guarded-sub.json").read_text())
          generic=json.loads(Path("fixture-generic.json").read_text())
          invalid=json.loads(Path("fixture-invalid.json").read_text())
          contradictory=json.loads(Path("fixture-contradictory.json").read_text())
          add_overflow=json.loads(Path("fixture-add-overflow.json").read_text())
          sub_underflow=json.loads(Path("fixture-sub-underflow.json").read_text())
          unsupported=json.loads(Path("fixture-unsupported.json").read_text())
          contract_valid=json.loads(Path("fixture-contract-valid.json").read_text())
          contract_invalid=json.loads(Path("fixture-contract-invalid.json").read_text())
          contract_vacuous=json.loads(Path("fixture-contract-vacuous.json").read_text())
          contract_arithmetic=json.loads(Path("fixture-contract-arithmetic.json").read_text())
          contract_result_valid=json.loads(Path("fixture-contract-result-valid.json").read_text())
          contract_result_invalid=json.loads(Path("fixture-contract-result-invalid.json").read_text())
          contract_result_add_valid=json.loads(Path("fixture-contract-result-add-valid.json").read_text())
          contract_result_add_invalid=json.loads(Path("fixture-contract-result-add-invalid.json").read_text())
          assert branch["status"] == "checked_valid", branch
          assert loop["status"] == "checked_valid", loop
          assert independent["status"] == "checked_valid", independent
          assert assumed["status"] == "checked_valid", assumed
          assert guarded_add["status"] == "checked_valid", guarded_add
          assert guarded_sub["status"] == "checked_valid", guarded_sub
          assert generic["status"] == "checked_valid", generic
          assert generic["selected_generic_arguments"] == [
              {"parameter":"T","concrete_type":"i32"}
          ], generic
          assert assumed["assumptions"] == [{"line":2,"expression":"(x > 0)"}], assumed
          assert assumed["assertion_paths"] == [{"line":3,"conditions":["(x > 0)"]}], assumed
          assert contradictory["status"] == "proof_failure", contradictory
          assert contradictory["failure_stage"] == "non_vacuity", contradictory
          assert add_overflow["status"] == "proof_failure", add_overflow
          assert sub_underflow["status"] == "proof_failure", sub_underflow
          assert len(independent["parameter_domains"]) == 2, independent
          assert all(row["independent"] for row in independent["parameter_domains"]), independent
          assert invalid["status"] == "proof_failure", invalid
          assert unsupported["status"] == "unsupported", unsupported
          assert contract_valid["status"] == "checked_valid", contract_valid
          assert contract_valid["contract_requires"] == ["x"], contract_valid
          assert contract_valid["contract_ensures"] == ["x"], contract_valid
          assert contract_valid["contract_precondition_nonvacuity"] is True, contract_valid
          assert contract_invalid["status"] == "proof_failure", contract_invalid
          assert contract_vacuous["status"] == "proof_failure", contract_vacuous
          assert contract_vacuous["failure_stage"] == "non_vacuity", contract_vacuous
          assert contract_arithmetic["status"] == "unsupported", contract_arithmetic
          assert contract_result_valid["status"] == "checked_valid", contract_result_valid
          assert contract_result_valid["return_domain"] == {
              "rust_type":"u8",
              "verus_result":"__destiny_result",
          }, contract_result_valid
          assert contract_result_valid["contract_ensures"] == [
              "(__destiny_result == x)"
          ], contract_result_valid
          assert contract_result_invalid["status"] == "proof_failure", contract_result_invalid
          assert contract_result_add_valid["status"] == "checked_valid", contract_result_add_valid
          assert contract_result_add_valid["contract_requires"] == ["(x < 255)"], contract_result_add_valid
          assert len(contract_result_add_valid["contract_arithmetic_guards"]) == 1, contract_result_add_valid
          assert contract_result_add_valid["contract_arithmetic_guards"][0] == {
              "clause_kind":"ensures",
              "expression":"__destiny_result == x + 1",
              "guard":"(x <= 254)",
              "rust_type":"u8",
              "operator":"+",
          }, contract_result_add_valid
          assert "(x <= 254)" in contract_result_add_valid["contract_ensures"][0], contract_result_add_valid
          assert contract_result_add_invalid["status"] == "proof_failure", contract_result_add_invalid
          assert loop["bounds"] == [{
              "kind":"literal_for_exhaustive_unroll",
              "start":0,
              "end":3,
              "iterations":3,
          }], loop
          PY

      - name: Verify logical refinement proofs
        run: |
          python3 -B verification/tools/check_concurrency_acceptance.py --structure-only
          python3 -B verification/tools/run_verus_campaign.py --verus "$VERUS_BIN"

      - name: Bind Kani-selected identities to the fresh Verus campaign receipts
        run: |
          python3 -B verification/tools/bind_kani_verus.py check-campaign \
            --binding .aegis/destiny/kani-autoharness-discovery/verus-binding.json \
            --campaign-dir .aegis/destiny/verus-final-campaign \
            --output .aegis/destiny/kani-autoharness-discovery/verus-receipt-binding.json

      - name: Retain complete counted results, VIR inventories and scope audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verus-counted-concurrency-evidence
          path: |
            .aegis/destiny/receipts
            .aegis/destiny/verus-artifacts
            .aegis/destiny/verus-final-campaign
            .aegis/destiny/bindings
            .aegis/destiny/proofs
            .aegis/destiny/concurrency-acceptance.json
            .aegis/destiny/kani-autoharness-discovery
            .aegis/destiny/kani-autoharness-fixtures
            .aegis/destiny/verus-kani-subset
            fixture-branch.json
            fixture-loop.json
            fixture-independent.json
            fixture-assumed.json
            fixture-guarded-add.json
            fixture-guarded-sub.json
            fixture-generic.json
            fixture-invalid.json
