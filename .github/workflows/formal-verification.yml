          assert finalization["verus_checked_scoped"] is True, finalization
          assert campaign_binding["status"] == "KANI_SELECTED_VERUS_CHECKED_SCOPED", campaign_binding

          assert manifest["schema"] == 2, manifest
          assert manifest["status"] == "KVERUS_REVIEWED_EVIDENCE_MANIFEST", manifest
          assert manifest["engine"] == "verus", manifest
          assert manifest["kani_proof_credit"] is False, manifest
          assert manifest["verus_checked_scoped"] is True, manifest
          assert manifest["proof_credit_source"] == "existing_verus_checked_scoped_receipts_only", manifest

          assert audit["status"] == "KVERUS_REVIEWED_EVIDENCE_AUDITED", audit
          assert audit["engine"] == "verus", audit
          assert audit["kani_proof_credit"] is False, audit
          assert audit["verus_checked_scoped"] is True, audit
          assert audit["verified_artifact_count"] == len(manifest["artifacts"]), audit
          assert workflow["checked_receipt_count"] == manifest["checked_receipt_count"], (workflow, manifest)
          assert workflow["verified_artifact_count"] == audit["verified_artifact_count"], (workflow, audit)
          assert workflow["manifest_path"] == audit["manifest_path"], (workflow, audit)
          assert workflow["manifest_digest"] == audit["manifest_digest"], (workflow, audit)

          assert lifecycle["stage"] == "reviewed-audited", lifecycle
          assert lifecycle["canonical_stage"] == "reviewed_audited", lifecycle
          assert lifecycle["consistent"] is True, lifecycle

          assert integrity["status"] == "KVERUS_REVIEWED_INTEGRITY", integrity
          assert integrity["lifecycle_stage"] == "reviewed-audited", integrity
          assert integrity["valid"] is True, integrity
          assert integrity["validated_artifact_count"] == 6, integrity
          assert integrity["violations"] == [], integrity
          assert integrity["proof_credit"] is False, integrity

          assert explanation["status"] == "KVERUS_REVIEWED_EXPLANATION", explanation
          assert explanation["lifecycle"]["stage"] == "reviewed-audited", explanation
          assert explanation["integrity"]["valid"] is True, explanation
          assert explanation["recommended_next_action"] is None, explanation
          assert explanation["ready_for_next_action"] is False, explanation
          assert explanation["complete"] is True, explanation
          assert explanation["blockers"] == [], explanation
          assert explanation["proof_credit"] is False, explanation
          PY

