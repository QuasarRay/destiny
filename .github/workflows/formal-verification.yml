name: formal-verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specification-and-meta:
    name: specification and metaverification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version
          python --version

      - name: Test engine-independent original-Destiny specification
        run: cargo test --manifest-path verification/spec/Cargo.toml

      - name: Check procedural macro crate
        run: cargo check --manifest-path verification/meta/Cargo.toml

      - name: Test declarative metaverification support
        run: cargo test --manifest-path verification/meta-support/Cargo.toml

      - name: Compile and run non-Kani proof-crate regression tests
        run: cargo test --manifest-path verification/kani/Cargo.toml

      - name: Validate proof markers against exhaustive original test catalog
        run: python verification/tools/proof_coverage.py

      - name: Scan repeated implementation and proof patterns
        run: python verification/tools/pattern_scan.py --json > repetition-patterns.json

      - uses: actions/upload-artifact@v4
        with:
          name: formal-repetition-patterns
          path: repetition-patterns.json

  vendor-automation-boundary:
    name: vendored Verus/Kani automation boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify immutable upstream source pins
        run: python3 -B verification/tools/check_vendor_integrity.py

      - name: Materialize Kani compiler source dependency
        run: git -C third_party/kani submodule update --init --depth=1 charon

      - name: Apply validated metadata-only Kani patch
        run: python3 -B verification/tools/bootstrap_kani_vendor.py

      - name: Install pinned Kani source toolchain
        run: |
          rustup toolchain install nightly-2026-08-21 --profile minimal
          rustup component add --toolchain nightly-2026-08-21 rustc-dev rust-src llvm-tools rustfmt

      - name: Resolve pinned KVerus refactor dependencies
        run: cargo +nightly-2026-08-21 generate-lockfile --manifest-path verification/automation/Cargo.toml

      - name: Retain resolved KVerus automation lockfile
        uses: actions/upload-artifact@v4
        with:
          name: kverus-automation-lockfile
          path: verification/automation/Cargo.lock

      - name: Test shared autoharness metadata adapter
        run: |
          cargo +nightly-2026-08-21 test --manifest-path verification/automation/Cargo.toml --locked
          python3 -B verification/tools/test_kani_discovery.py

      - name: Test reviewed campaign runner receipt protocol
        run: |
          set -euo pipefail
          tmp=".aegis/destiny/campaign-runner-contract-test"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          set +e
          python3 -B verification/tools/run_verus_campaign.py \
            --verus "$tmp/not-used-verus" \
            --plan "$tmp/missing-plan.json" \
            --campaign-dir "$tmp/campaign" \
            --receipt "$tmp/runner-receipt.json" \
            > "$tmp/stdout.jsonl"
          rc=$?
          set -e
          test "$rc" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path(".aegis/destiny/campaign-runner-contract-test")
          receipt=json.loads((root/"runner-receipt.json").read_text())
          final_stdout=json.loads((root/"stdout.jsonl").read_text().splitlines()[-1])
          assert receipt == final_stdout, (receipt, final_stdout)
          assert receipt["schema"] == 1, receipt
          assert receipt["status"] == "INCOMPLETE", receipt
          assert receipt["engine"] == "verus", receipt
          assert receipt["kani_proof_credit"] is False, receipt
          assert receipt["verus_checked_scoped"] is False, receipt
          assert receipt["formal_audit"] == "INCOMPLETE", receipt
          assert receipt["case_acceptance_exit"] == -1, receipt
          assert "missing-plan.json" in receipt["reason"], receipt
          PY

      - name: Build patched pinned Kani from source
        working-directory: third_party/kani
        run: cargo +nightly-2026-08-21 build-dev -- --release

      # Mirrors the unit-test phase of Kani's own scripts/kani-regression.sh for
      # every upstream package patched or semantically consumed by KVerus.
      - name: Run Kani upstream regression unit phase for patched surfaces
        working-directory: third_party/kani
        run: |
          cargo +nightly-2026-08-21 test -p kani-compiler
          cargo +nightly-2026-08-21 test -p kani-driver
          cargo +nightly-2026-08-21 test -p kani_metadata
          RUSTFLAGS=--cfg=kani_sysroot cargo +nightly-2026-08-21 test -p kani_macros --features syn/extra-traits --lib

      - name: Prepare and exercise reviewed KVerus lifecycle boundary
        run: |
          set -euo pipefail
          out=".aegis/destiny/kani-autoharness-discovery"
          regression=".aegis/destiny/kverus-reviewed-lifecycle-regression"
          rm -rf "$out" "$regression"
          mkdir -p "$out"

          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            prepare-reviewed \
            --manifest-path verification/spec/Cargo.toml \
            --output-dir "$out" \
            > "$out/reviewed-preparation-stdout.json"
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            status-reviewed --reviewed-dir "$out" \
            > "$out/reviewed-lifecycle-prepared.json"

          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            validate-reviewed --reviewed-dir "$out" \
            > "$out/reviewed-integrity-prepared.json"
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            explain-reviewed --reviewed-dir "$out" \
            > "$out/reviewed-explanation-prepared.json"

          python3 -B verification/tools/test_bind_kani_verus.py
          python3 -B verification/tools/test_run_verus_campaign.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path(".aegis/destiny/kani-autoharness-discovery")
          discovery=json.loads((root/"normalized-discovery.json").read_text())
          binding=json.loads((root/"verus-binding.json").read_text())
          receipt=json.loads((root/"reviewed-preparation-receipt.json").read_text())
          stdout_receipt=json.loads((root/"reviewed-preparation-stdout.json").read_text())
          lifecycle=json.loads((root/"reviewed-lifecycle-prepared.json").read_text())
          integrity=json.loads((root/"reviewed-integrity-prepared.json").read_text())
          explanation=json.loads((root/"reviewed-explanation-prepared.json").read_text())

          assert discovery["default_engine"] == "verus", discovery
          assert discovery["proof_credit"] is False, discovery
          assert discovery["crates_with_autoharness_metadata"] > 0, discovery
          assert discovery["candidates"], discovery

          assert binding["status"] == "BOUND_FOR_VERUS", binding
          assert binding["default_engine"] == "verus", binding
          assert binding["kani_proof_credit"] is False, binding
          assert binding["selected"], binding
          assert not binding["unresolved"], binding

          assert receipt == stdout_receipt, (receipt, stdout_receipt)
          assert receipt["status"] == "KVERUS_REVIEWED_BINDING_PREPARED", receipt
          assert receipt["default_engine"] == "verus", receipt
          assert receipt["proof_credit"] is False, receipt
          assert receipt["verus_campaign_checked"] is False, receipt
          assert receipt["binding_status"] == "BOUND_FOR_VERUS", receipt
          assert receipt["selected_count"] == len(binding["selected"]), receipt
          assert receipt["unresolved_count"] == 0, receipt
          assert receipt["controller_obligation_count"] == len(binding["controller_obligations"]), receipt
          assert receipt["contract_inventory_count"] == binding["contract_inventory_count"], receipt
          assert receipt["contract_clause_count"] == binding["contract_clause_count"], receipt

          assert lifecycle["status"] == "KVERUS_REVIEWED_LIFECYCLE", lifecycle
          assert lifecycle["stage"] == "reviewed-prepared", lifecycle
          assert lifecycle["canonical_stage"] == "reviewed_prepared", lifecycle
          assert lifecycle["consistent"] is True, lifecycle
          assert lifecycle["proof_credit"] is False, lifecycle
          assert "finalize-reviewed" in lifecycle["legal_next_actions"], lifecycle

          assert integrity["status"] == "KVERUS_REVIEWED_INTEGRITY", integrity
          assert integrity["lifecycle_stage"] == "reviewed-prepared", integrity
          assert integrity["canonical_stage"] == "reviewed_prepared", integrity
          assert integrity["canonical_validation"] == "reviewed_integrity_validation", integrity
          assert integrity["valid"] is True, integrity
          assert integrity["validated_artifact_count"] == 2, integrity
          assert integrity["violations"] == [], integrity
          assert integrity["proof_credit"] is False, integrity
          assert {row["kind"] for row in integrity["artifacts"]} == {
              "reviewed-preparation-receipt",
              "verus-binding",
          }, integrity

          assert explanation["status"] == "KVERUS_REVIEWED_EXPLANATION", explanation
          assert explanation["lifecycle"]["stage"] == "reviewed-prepared", explanation
          assert explanation["integrity"]["valid"] is True, explanation
          assert explanation["recommended_next_action"] == "run-reviewed", explanation
          assert explanation["ready_for_next_action"] is True, explanation
          assert explanation["complete"] is False, explanation
          assert explanation["blockers"] == [], explanation
          assert explanation["proof_credit"] is False, explanation
          PY

          mkdir -p "$regression"
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            prepare-reviewed \
            --manifest-path verification/spec/Cargo.toml \
            --output-dir "$regression" \
            > "$regression/reviewed-preparation-stdout.json"
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            status-reviewed --reviewed-dir "$regression" \
            > "$regression/reviewed-lifecycle-prepared.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path(".aegis/destiny/kverus-reviewed-lifecycle-regression")
          binding=json.loads((root/"verus-binding.json").read_text())
          receipt=json.loads((root/"reviewed-preparation-receipt.json").read_text())
          stdout_receipt=json.loads((root/"reviewed-preparation-stdout.json").read_text())
          lifecycle=json.loads((root/"reviewed-lifecycle-prepared.json").read_text())
          assert receipt == stdout_receipt, (receipt, stdout_receipt)
          assert receipt["binding_path"] == str(root/"verus-binding.json"), receipt
          assert lifecycle["stage"] == "reviewed-prepared", lifecycle
          assert lifecycle["canonical_stage"] == "reviewed_prepared", lifecycle
          assert lifecycle["consistent"] is True, lifecycle
          binding=json.loads((root/"verus-binding.json").read_text())
          campaign=root/"synthetic-finalization-campaign"
          campaign.mkdir(parents=True, exist_ok=True)
          (campaign/"binding.json").write_text(json.dumps({"status":"BOUND"})+"\n")
          (campaign/"audit.json").write_text(json.dumps({"status":"CHECKED_SCOPED"})+"\n")
          for obligation in binding["controller_obligations"]:
              (campaign/f"{obligation}.json").write_text(
                  json.dumps({"status":"CHECKED_SCOPED"})+"\n"
              )
          PY

          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            finalize-reviewed \
            --reviewed-dir "$regression" \
            --campaign-dir "$regression/synthetic-finalization-campaign" \
            > "$regression/reviewed-finalization-stdout.json"
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            status-reviewed --reviewed-dir "$regression" \
            > "$regression/reviewed-lifecycle-finalized.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path(".aegis/destiny/kverus-reviewed-lifecycle-regression")
          binding=json.loads((root/"verus-binding.json").read_text())
          campaign_binding=json.loads((root/"verus-receipt-binding.json").read_text())
          receipt=json.loads((root/"reviewed-finalization-receipt.json").read_text())
          stdout_receipt=json.loads((root/"reviewed-finalization-stdout.json").read_text())
          lifecycle=json.loads((root/"reviewed-lifecycle-finalized.json").read_text())

          assert receipt == stdout_receipt, (receipt, stdout_receipt)
          assert campaign_binding["status"] == "KANI_SELECTED_VERUS_CHECKED_SCOPED", campaign_binding
          assert campaign_binding["engine"] == "verus", campaign_binding
          assert campaign_binding["kani_proof_credit"] is False, campaign_binding
          assert campaign_binding["verus_checked_scoped"] is True, campaign_binding
          assert receipt["status"] == "KVERUS_REVIEWED_VERUS_FINALIZED", receipt
          assert receipt["engine"] == "verus", receipt
          assert receipt["kani_proof_credit"] is False, receipt
          assert receipt["verus_checked_scoped"] is True, receipt
          assert receipt["campaign_binding_status"] == "KANI_SELECTED_VERUS_CHECKED_SCOPED", receipt
          assert receipt["checked_receipt_count"] == len(binding["controller_obligations"]), receipt
          assert receipt["contract_inventory_count"] == binding["contract_inventory_count"], receipt
          assert receipt["contract_clause_count"] == binding["contract_clause_count"], receipt

          assert lifecycle["stage"] == "reviewed-finalized", lifecycle
          assert lifecycle["canonical_stage"] == "reviewed_finalized", lifecycle
          assert "manifest-reviewed" in lifecycle["legal_next_actions"], lifecycle
          PY

          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            manifest-reviewed \
            --reviewed-dir "$regression" \
            > "$regression/reviewed-evidence-manifest-stdout.json"
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            status-reviewed --reviewed-dir "$regression" \
            > "$regression/reviewed-lifecycle-manifested.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path(".aegis/destiny/kverus-reviewed-lifecycle-regression")
          binding=json.loads((root/"verus-binding.json").read_text())
          campaign_binding=json.loads((root/"verus-receipt-binding.json").read_text())
          manifest=json.loads((root/"reviewed-evidence-manifest.json").read_text())
          stdout_manifest=json.loads((root/"reviewed-evidence-manifest-stdout.json").read_text())
          lifecycle=json.loads((root/"reviewed-lifecycle-manifested.json").read_text())

          assert manifest == stdout_manifest, (manifest, stdout_manifest)
          assert manifest["schema"] == 2, manifest
          assert manifest["status"] == "KVERUS_REVIEWED_EVIDENCE_MANIFEST", manifest
          assert manifest["engine"] == "verus", manifest
          assert manifest["kani_proof_credit"] is False, manifest
          assert manifest["verus_checked_scoped"] is True, manifest
          assert manifest["proof_credit_source"] == "existing_verus_checked_scoped_receipts_only", manifest
          assert manifest["selected_count"] == len(binding["selected"]), manifest
          assert manifest["controller_obligation_count"] == len(binding["controller_obligations"]), manifest
          assert manifest["checked_receipt_count"] == len(campaign_binding["receipts"]), manifest
          assert manifest["contract_inventory_count"] == binding["contract_inventory_count"], manifest
          assert manifest["contract_clause_count"] == binding["contract_clause_count"], manifest
          kinds={row["kind"]: row for row in manifest["artifacts"]}
          assert set(kinds) == {
              "reviewed-preparation-receipt",
              "verus-binding",
              "verus-receipt-binding",
              "reviewed-finalization-receipt",
          }, kinds
          assert all(row["digest_algorithm"] == "sha256" for row in kinds.values()), kinds
          assert all(len(row["digest"]) == 64 for row in kinds.values()), kinds
          assert all(all(ch in "0123456789abcdef" for ch in row["digest"]) for row in kinds.values()), kinds
          assert kinds["reviewed-finalization-receipt"]["canonical_token"] == "reviewed_finalization_receipt", kinds
          assert kinds["verus-receipt-binding"]["proof_credit_source"] == "verus_checked_scoped", kinds
          assert kinds["verus-binding"]["proof_credit_source"] == "none", kinds

          assert lifecycle["stage"] == "reviewed-manifested", lifecycle
          assert lifecycle["canonical_stage"] == "reviewed_manifested", lifecycle
          assert "audit-reviewed" in lifecycle["legal_next_actions"], lifecycle
          PY

          cp "$regression/verus-binding.json" "$regression/verus-binding.json.audit-backup"
          printf '\n' >> "$regression/verus-binding.json"
          if cargo +nightly-2026-08-21 run --quiet \
              --manifest-path verification/automation/Cargo.toml --locked -- \
              audit-reviewed --reviewed-dir "$regression" \
              > "$regression/audit-drift-unexpected-success.json" \
              2> "$regression/audit-drift-stderr.txt"; then
            echo "audit-reviewed unexpectedly accepted byte-level evidence drift" >&2
            exit 1
          fi
          if cargo +nightly-2026-08-21 run --quiet \
              --manifest-path verification/automation/Cargo.toml --locked -- \
              validate-reviewed --reviewed-dir "$regression" \
              > "$regression/reviewed-integrity-drift.json" \
              2> "$regression/reviewed-integrity-drift-stderr.txt"; then
            echo "validate-reviewed unexpectedly accepted byte-level evidence drift" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path(".aegis/destiny/kverus-reviewed-lifecycle-regression")
          integrity=json.loads((root/"reviewed-integrity-drift.json").read_text())
          assert integrity["status"] == "KVERUS_REVIEWED_INTEGRITY", integrity
          assert integrity["lifecycle_stage"] == "reviewed-manifested", integrity
          assert integrity["valid"] is False, integrity
          assert integrity["validated_artifact_count"] == 4, integrity
          assert integrity["violations"], integrity
          assert any("manifest diverged" in row for row in integrity["violations"]), integrity
          assert integrity["proof_credit"] is False, integrity
          PY
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            status-reviewed --reviewed-dir "$regression" \
            > "$regression/reviewed-lifecycle-after-drift-failure.json"
          mv "$regression/verus-binding.json.audit-backup" "$regression/verus-binding.json"

          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            audit-reviewed \
            --reviewed-dir "$regression" \
            > "$regression/reviewed-evidence-audit-stdout.json"
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            status-reviewed --reviewed-dir "$regression" \
            > "$regression/reviewed-lifecycle-audited.json"

          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            validate-reviewed --reviewed-dir "$regression" \
            > "$regression/reviewed-integrity-audited.json"
          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            explain-reviewed --reviewed-dir "$regression" \
            > "$regression/reviewed-explanation-audited.json"

          if cargo +nightly-2026-08-21 run --quiet \
              --manifest-path verification/automation/Cargo.toml --locked -- \
              finalize-reviewed \
              --reviewed-dir "$regression" \
              --campaign-dir "$regression/synthetic-finalization-campaign" \
              > "$regression/finalize-after-audit-unexpected-success.json" \
              2> "$regression/finalize-after-audit-stderr.txt"; then
            echo "finalize-reviewed unexpectedly accepted audited lifecycle rollback" >&2
            exit 1
          fi

          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            status-reviewed --reviewed-dir "$out" \
            > "$out/reviewed-lifecycle-handoff.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          regression=Path(".aegis/destiny/kverus-reviewed-lifecycle-regression")
          audit=json.loads((regression/"reviewed-evidence-audit.json").read_text())
          stdout_audit=json.loads((regression/"reviewed-evidence-audit-stdout.json").read_text())
          drift_lifecycle=json.loads((regression/"reviewed-lifecycle-after-drift-failure.json").read_text())
          audited_lifecycle=json.loads((regression/"reviewed-lifecycle-audited.json").read_text())
          audited_integrity=json.loads((regression/"reviewed-integrity-audited.json").read_text())
          audited_explanation=json.loads((regression/"reviewed-explanation-audited.json").read_text())

          assert audit == stdout_audit, (audit, stdout_audit)
          assert audit["status"] == "KVERUS_REVIEWED_EVIDENCE_AUDITED", audit
          assert audit["engine"] == "verus", audit
          assert audit["kani_proof_credit"] is False, audit
          assert audit["verus_checked_scoped"] is True, audit
          assert audit["manifest_digest_algorithm"] == "sha256", audit
          assert len(audit["manifest_digest"]) == 64, audit
          assert audit["verified_artifact_count"] == 4, audit
          assert audit["proof_credit_source"] == "existing_verus_checked_scoped_receipts_only", audit

          assert drift_lifecycle["stage"] == "reviewed-manifested", drift_lifecycle
          assert audited_lifecycle["stage"] == "reviewed-audited", audited_lifecycle
          assert audited_lifecycle["canonical_stage"] == "reviewed_audited", audited_lifecycle
          assert audited_lifecycle["legal_next_actions"] == ["audit-reviewed"], audited_lifecycle

          assert audited_integrity["status"] == "KVERUS_REVIEWED_INTEGRITY", audited_integrity
          assert audited_integrity["lifecycle_stage"] == "reviewed-audited", audited_integrity
          assert audited_integrity["canonical_stage"] == "reviewed_audited", audited_integrity
          assert audited_integrity["valid"] is True, audited_integrity
          assert audited_integrity["validated_artifact_count"] == 6, audited_integrity
          assert audited_integrity["violations"] == [], audited_integrity
          assert audited_integrity["proof_credit"] is False, audited_integrity
          assert {row["kind"] for row in audited_integrity["artifacts"]} == {
              "reviewed-preparation-receipt",
              "verus-binding",
              "verus-receipt-binding",
              "reviewed-finalization-receipt",
              "reviewed-evidence-manifest",
              "reviewed-evidence-audit",
          }, audited_integrity

          assert audited_explanation["status"] == "KVERUS_REVIEWED_EXPLANATION", audited_explanation
          assert audited_explanation["lifecycle"]["stage"] == "reviewed-audited", audited_explanation
          assert audited_explanation["integrity"]["valid"] is True, audited_explanation
          assert audited_explanation["recommended_next_action"] is None, audited_explanation
          assert audited_explanation["ready_for_next_action"] is False, audited_explanation
          assert audited_explanation["complete"] is True, audited_explanation
          assert audited_explanation["blockers"] == [], audited_explanation
          assert audited_explanation["proof_credit"] is False, audited_explanation

          handoff=Path(".aegis/destiny/kani-autoharness-discovery")
          handoff_lifecycle=json.loads((handoff/"reviewed-lifecycle-handoff.json").read_text())
          assert handoff_lifecycle["stage"] == "reviewed-prepared", handoff_lifecycle
          assert handoff_lifecycle["canonical_stage"] == "reviewed_prepared", handoff_lifecycle
          assert handoff_lifecycle["consistent"] is True, handoff_lifecycle
          assert not (handoff/"verus-receipt-binding.json").exists(), handoff_lifecycle
          assert not (handoff/"reviewed-finalization-receipt.json").exists(), handoff_lifecycle
          assert not (handoff/"reviewed-evidence-manifest.json").exists(), handoff_lifecycle
          assert not (handoff/"reviewed-evidence-audit.json").exists(), handoff_lifecycle
          PY

      - name: Discover the generated-obligation fixture corpus through the same Kani compiler path
        run: |
          set -euo pipefail
          for fixture in valid invalid unsupported contracts; do
            out=".aegis/destiny/kani-autoharness-fixtures/$fixture"
            mkdir -p "$out"
            cargo +nightly-2026-08-21 run --quiet \
              --manifest-path verification/automation/Cargo.toml --locked -- \
              prepare \
              --manifest-path "verification/automation/fixtures/$fixture/Cargo.toml" \
              --output-dir "$out" \
              > "$out/prepare-stdout.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path(
              ".aegis/destiny/kani-autoharness-fixtures/contracts/normalized-discovery.json"
          ).read_text())
          assert contract["proof_credit"] is False, contract
          rows=contract["contracted_functions"]
          expected={
              "contracted_valid",
              "contracted_invalid",
              "contracted_vacuous",
              "contracted_arithmetic",
              "contracted_result_valid",
              "contracted_result_invalid",
              "contracted_result_add_valid",
              "contracted_result_add_invalid",
          }
          by_name={}
          for row in rows:
              name=next((name for name in expected if row["function"].endswith(name)), None)
              assert name is not None, row
              assert name not in by_name, (name, rows)
              by_name[name]=row
              assert row["file"].endswith("src/lib.rs"), row
              assert row["provenance"] == "kani_metadata::KaniMetadata::contracted_functions", row
              assert row["clauses"], row
              assert all(clause["kind"] in {"requires","ensures","modifies"} for clause in row["clauses"]), row
              assert all(clause["expression"].strip() for clause in row["clauses"]), row
          assert set(by_name) == expected, by_name
          assert [c["kind"] for c in by_name["contracted_valid"]["clauses"]].count("requires") == 1
          assert [c["kind"] for c in by_name["contracted_valid"]["clauses"]].count("ensures") == 1
          assert [c["kind"] for c in by_name["contracted_vacuous"]["clauses"]].count("requires") == 2
          assert any(
              clause["kind"] == "requires" and "+" in clause["expression"]
              for clause in by_name["contracted_arithmetic"]["clauses"]
          )
          selected={
              name: [
                  candidate for candidate in contract["candidates"]
                  if candidate["function"].endswith(name)
              ]
              for name in expected
          }
          assert all(len(rows) == 1 for rows in selected.values()), selected
          assert all(rows[0]["disposition"] == "kani_eligible" for rows in selected.values()), selected

          plan=json.loads(Path(
              ".aegis/destiny/kani-autoharness-fixtures/contracts/automation-plan.json"
          ).read_text())
          assert plan["schema"] == 1, plan
          assert plan["default_engine"] == "verus", plan
          assert plan["proof_credit"] is False, plan
          assert plan["counts"]["selected"] >= len(expected), plan
          assert plan["counts"]["contracted_functions"] == len(expected), plan
          assert plan["counts"]["contract_clauses"] >= len(expected), plan
          planned={
              next(name for name in expected if row["function"].endswith(name)): row
              for row in plan["contracted_functions"]
          }
          assert set(planned) == expected, planned
          assert all(row["planner_status"] == "downstream_subset_check_required"
                     for row in planned.values()), planned
          assert all(
              clause["canonical_tokens"].strip()
              for row in planned.values()
              for clause in row["clauses"]
          ), planned
          assert all(
              clause["expression"].strip()
              for row in planned.values()
              for clause in row["clauses"]
          ), planned

          receipt=json.loads(Path(
              ".aegis/destiny/kani-autoharness-fixtures/contracts/preparation-receipt.json"
          ).read_text())
          stdout_receipt=json.loads(Path(
              ".aegis/destiny/kani-autoharness-fixtures/contracts/prepare-stdout.json"
          ).read_text())
          assert receipt == stdout_receipt, (receipt, stdout_receipt)
          assert receipt["status"] == "KVERUS_PREPARED", receipt
          assert receipt["default_engine"] == "verus", receipt
          assert receipt["proof_credit"] is False, receipt
          assert receipt["counts"] == plan["counts"], (receipt, plan)
          PY
          python3 -B verification/tools/test_verus_subset.py

