name: formal-verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  specification-and-meta:
    name: specification and metaverification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version
          python --version

      - name: Test engine-independent original-Destiny specification
        run: cargo test --manifest-path verification/spec/Cargo.toml

      - name: Check procedural macro crate
        run: cargo check --manifest-path verification/meta/Cargo.toml

      - name: Test declarative metaverification support
        run: cargo test --manifest-path verification/meta-support/Cargo.toml

      - name: Compile and run non-Kani proof-crate regression tests
        run: cargo test --manifest-path verification/kani/Cargo.toml

      - name: Test Verus/Kani structural bridge
        run: python verification/automation/test_verus_kani.py -v

      - name: Validate verifier vendor gitlinks without network
        run: python verification/tools/vendor_verifiers.py

      - name: Validate proof markers against exhaustive original test catalog
        run: python verification/tools/proof_coverage.py

      - name: Scan repeated implementation and proof patterns
        run: python verification/tools/pattern_scan.py --json > repetition-patterns.json

      - uses: actions/upload-artifact@v4
        with:
          name: formal-repetition-patterns
          path: repetition-patterns.json

  kani:
    name: Kani 0.68.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
          cargo kani --version

      - name: Verify Kani harnesses
        run: cargo kani -Z function-contracts -Z stubbing --manifest-path verification/kani/Cargo.toml --output-format=terse

  verus:
    name: Verus 0.2026.09.20.aef82ed
    runs-on: ubuntu-24.04
    env:
      VERUS_RELEASE: 0.2026.09.20.aef82ed
      VERUS_SHA256: 7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the pinned maintained controller
        uses: actions/checkout@v4
        with:
          repository: QuasarRay/Aegis
          ref: 46f90f7dbc4f3db8a1a74ef9d8aa91fb4b679460
          path: .agents

      - name: Apply and validate the exported controller postimages
        run: python3 -B verification/tools/bootstrap_controller.py

      - name: Install Verus Rust toolchain
        run: rustup toolchain install 1.98.1-x86_64-unknown-linux-gnu

      - name: Download pinned Verus release
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/verus-lang/verus/releases/download/release/$VERUS_RELEASE/verus-$VERUS_RELEASE-x86-linux.zip" \
            --output verus.zip
          echo "$VERUS_SHA256  verus.zip" | sha256sum --check -
          mkdir verus-dist
          unzip -q verus.zip -d verus-dist
          VERUS_BIN="$(find verus-dist -type f -name verus -perm -u+x | head -n 1)"
          test -n "$VERUS_BIN"
          echo "VERUS_BIN=$VERUS_BIN" >> "$GITHUB_ENV"
          "$VERUS_BIN" --version

      - name: Install pinned Kani metadata provider
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
          cargo kani --version

      - name: Verify Kani-assisted Verus vertical slice with CBMC proof execution blocked
        run: |
          set -euo pipefail
          CBMC_BIN="$(find "$HOME/.kani" -type f -name cbmc -perm -u+x | head -n 1)"
          test -n "$CBMC_BIN"
          export REAL_CBMC="${CBMC_BIN}.real"
          mv "$CBMC_BIN" "$REAL_CBMC"
          export CBMC_BLOCK_LOG="$RUNNER_TEMP/cbmc-invocations.log"
          : > "$CBMC_BLOCK_LOG"
          cat > "$CBMC_BIN" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >> "$CBMC_BLOCK_LOG"
          if [[ "${1:-}" == "--version" ]]; then
            exec "$REAL_CBMC" "$@"
          fi
          echo "CBMC symbolic execution is disabled for the Verus-default automation lane" >&2
          exit 97
          SH
          chmod +x "$CBMC_BIN"

          python3 -B verification/tools/verus_kani.py verify \
            --manifest-path verification/automation/fixtures/valid/Cargo.toml \
            --function branch_valid --verus "$VERUS_BIN" > automation-valid.json
          python3 -B verification/tools/verus_kani.py verify \
            --manifest-path verification/automation/fixtures/valid/Cargo.toml \
            --function fixed_loop_valid --verus "$VERUS_BIN" > automation-loop.json

          set +e
          python3 -B verification/tools/verus_kani.py verify \
            --manifest-path verification/automation/fixtures/invalid/Cargo.toml \
            --function branch_invalid --verus "$VERUS_BIN" > automation-invalid.json
          invalid_rc=$?
          python3 -B verification/tools/verus_kani.py verify \
            --manifest-path verification/automation/fixtures/unsupported/Cargo.toml \
            --function float_unsupported --verus "$VERUS_BIN" > automation-unsupported.json
          unsupported_rc=$?
          set -e

          test "$invalid_rc" -eq 1
          test "$unsupported_rc" -eq 1
          cp "$CBMC_BLOCK_LOG" cbmc-invocations.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          valid = json.loads(Path("automation-valid.json").read_text())
          loop = json.loads(Path("automation-loop.json").read_text())
          invalid = json.loads(Path("automation-invalid.json").read_text())
          unsupported = json.loads(Path("automation-unsupported.json").read_text())
          assert valid["status"] == "checked_valid", valid
          assert loop["status"] == "checked_valid", loop
          assert invalid["status"] == "refuted_or_unproved", invalid
          assert invalid["results"][0]["status"] == "proof_failure", invalid
          assert unsupported["status"] == "incomplete", unsupported
          assert unsupported["results"][0]["status"] == "unsupported", unsupported
          for line in Path("cbmc-invocations.log").read_text().splitlines():
              assert line == "--version", f"unexpected CBMC execution: {line}"
          PY
          mv "$REAL_CBMC" "$CBMC_BIN"

      - name: Replay the invalid fixture through explicit Kani reference mode
        run: |
          set -euo pipefail
          KANI_BIN="$(find "$HOME/.kani" -type f -name kani -perm -u+x | head -n 1)"
          test -n "$KANI_BIN"
          python3 -B verification/tools/verus_kani.py replay-kani             --source verification/automation/fixtures/invalid/src/lib.rs             --function branch_invalid --kani "$KANI_BIN" > automation-replay.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          replay = json.loads(Path("automation-replay.json").read_text())
          assert replay["status"] == "reproduced_source_failure", replay
          assert replay["source_location_reproduced"] is True, replay
          assert replay["original_source_unchanged"] is True, replay
          assert replay["playback_returncode"] != 0, replay
          PY

      - name: Verify logical refinement proofs
        run: |
          python3 -B verification/tools/check_concurrency_acceptance.py --structure-only
          python3 -B verification/tools/run_verus_campaign.py --verus "$VERUS_BIN"

      - name: Retain complete counted results, VIR inventories and scope audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verus-counted-concurrency-evidence
          path: |
            .aegis/destiny/receipts
            .aegis/destiny/verus-artifacts
            .aegis/destiny/verus-final-campaign
            .aegis/destiny/verus-kani
            .aegis/destiny/bindings
            .aegis/destiny/proofs
            .aegis/destiny/concurrency-acceptance.json
            automation-valid.json
            automation-loop.json
            automation-invalid.json
            automation-unsupported.json
            automation-replay.json
            cbmc-invocations.log

  runtime-parity:
    name: concrete runtime parity regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Minimally repair root lockfile
        run: cargo metadata --format-version 1 --no-deps > /dev/null

      - name: Commit minimally repaired root lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/formal/06-verifier-ci-gates'
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: regenerate root lockfile for original spec dependency"
            git push origin HEAD:formal/06-verifier-ci-gates
          fi

      - name: Upload minimally repaired root lockfile
        uses: actions/upload-artifact@v4
        with:
          name: canonical-root-cargo-lock
          path: Cargo.lock

      - name: Root parity regression
        run: cargo test --all-features original_

      - name: Check out the pinned original Destiny tests
        uses: actions/checkout@v4
        with:
          repository: carbonengine/destiny
          ref: 114e89fa584f0e1a81eb0a679aabf41af8870072
          path: original-destiny

      - name: Run unchanged original formation tests against both backends
        run: |
          cargo build --lib --all-features --locked
          python verification/tools/run_original_formation_tests.py --original-root original-destiny
          python verification/tools/run_original_formation_tests.py --original-root original-destiny --library target/debug/libdestiny_bevy_compat.so

      - name: Run the unchanged original evolution callback on the native library
        run: python3 -B verification/tools/run_original_callback_test.py --original-root original-destiny --library target/debug/libdestiny_bevy_compat.so
