          cargo +nightly-2026-08-21 run --quiet \
            --manifest-path verification/automation/Cargo.toml --locked -- \
            explain-reviewed --reviewed-dir "$reviewed" \
            > "$reviewed/reviewed-explanation-final.json"

          python3 - <<'PY'
          import json
