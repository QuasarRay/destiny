name: Rust workspace CI

on:
  push:
    branches: [destiny-rs-dev-2]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'destiny-rs/**'
      - 'src/**'
      - 'tools/destiny_equivalence_audit.py'
      - 'tools/tests/**'
      - 'blue-rs/crates/**'
      - '.github/workflows/blue-rs.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'destiny-rs/**'
      - 'blue-rs/crates/**'
      - '.github/workflows/blue-rs.yml'
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Inventory C++ to Rust equivalence gaps
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/destiny_equivalence_audit.py --json-out target/equivalence.json --markdown-out target/equivalence.md
          cat target/equivalence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compile all workspace targets from the repository root
        run: cargo check --locked --workspace --all-targets
      - name: Differential test original C++ Quaternion and Key implementations
        run: python3 tools/run_cpp_rust_differential.py
      - name: Test all workspace members
        run: cargo test --locked --workspace
      - name: Build both projects by package name
        run: cargo build --locked -p destiny-rs -p blue
