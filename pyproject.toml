[build-system]
requires = ["scikit-build-core>=0.11,<2"]
build-backend = "scikit_build_core.build"

[project]
name = "destiny-bevy-carbon-compat"
version = "0.4.0"
description = "Destiny Python API facade for a Bevy/Avian runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Destiny Bevy compatibility contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
# CMake installs the Python facade and native library into one platlib tree.
# Disabling scikit-build-core's automatic package copier avoids duplicate wheel
# entries and makes the CMake install manifest the single source of truth.
wheel.packages = []
wheel.py-api = "py3"
wheel.license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
# Keep local controllers, reference checkouts and user prompts out of the
# distribution. The required Rust path dependency is included explicitly.
sdist.exclude = [
    ".aegis/**",
    ".agents/**",
    "blue-rs/**",
    "third_party/**",
    "vendor/**",
    "DESTINY_RS_COMPLETE_IMPLEMENTATION_PROMPT.md",
    "DESTINY_WORLD_SIMULATION_GOAL.txt",
    "DESTINY_WORLD_SIMULATION_GOAL_PROMPT.md",
]
sdist.include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/CMakeLists.txt",
    "/LICENSE",
    "/README.md",
    "/COMPATIBILITY.md",
    "/VERIFICATION.md",
    "/IMPLEMENTATION_STATUS.md",
    "/REMEDIATION_STATUS.md",
    "/SECURITY.md",
    "/ARTIFACT_MANIFEST.md",
    "/RELEASE_GATES.md",
    "/V3_REMEDIATION_STATUS.md",
    "/V4_REMEDIATION_STATUS.md",
    "/deny.toml",
    "/.github/**/*.yml",
    "/.github/**/*.yaml",
    "/MANIFEST.in",
    "/rust-toolchain.toml",
    "/cmake/**/*.cmake",
    "/cmake/**/*.in",
    "/include/**/*.h",
    "/include/**/*.hpp",
    "/python/**/*.py",
    "/python/**/*.yaml",
    "/registry/**/*.json",
    "/src/**/*.rs",
    "/verification/spec/Cargo.toml",
    "/verification/spec/Cargo.lock",
    "/verification/spec/src/**/*.rs",
    "/verification/licenses/**",
    "/tests/**/*.py",
    "/tests/**/*.rs",
    "/tests/**/*.c",
    "/tests/**/*.cpp",
    "/tests/**/CMakeLists.txt",
    "/tools/**/*.py",
    "/THIRD_PARTY_NOTICES.md",
]
